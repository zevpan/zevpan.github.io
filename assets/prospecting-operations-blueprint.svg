<text x="56" y="1035" class="t s muted">PHASE 1</text>
<text x="56" y="1057" class="t b">Stabilize Current Workflow</text>
<text x="56" y="1078" class="t s">Strict IDs · incremental reads · batching</text>
<text x="56" y="1095" class="t s">Append-only interaction history</text>

<rect x="344" y="1012" width="288" height="108" rx="10" class="box"/>
<text x="360" y="1035" class="t s muted">PHASE 2</text>
<text x="360" y="1057" class="t b">Relational Data Layer</text>
<text x="360" y="1078" class="t s">People · Accounts · Interactions · Actions</text>
<text x="360" y="1095" class="t s">Overrides · Audit Events</text>

<rect x="648" y="1012" width="288" height="108" rx="10" class="box"/>
<text x="664" y="1035" class="t s muted">PHASE 3</text>
<text x="664" y="1057" class="t b">Decision Services</text>
<text x="664" y="1078" class="t s">State engine · eligibility · AI analysis</text>
<text x="664" y="1095" class="t s">Capacity-aware prioritization</text>

<rect x="952" y="1012" width="288" height="108" rx="10" class="box"/>
<text x="968" y="1035" class="t s muted">PHASE 4</text>
<text x="968" y="1057" class="t b">Operations Console</text>
<text x="968" y="1078" class="t s">Action Queue · relationship history</text>
<text x="968" y="1095" class="t s">Reconciliation · overrides</text>

<rect x="1256" y="1012" width="304" height="108" rx="10" class="box"/>
<text x="1272" y="1035" class="t s muted">PHASE 5</text>
<text x="1272" y="1057" class="t b">Integrations &amp; Intelligence</text>
<text x="1272" y="1078" class="t s">CRM / email · metrics · AI evaluation</text>
<text x="1272" y="1095" class="t s">Continuous improvement</text>

<text x="40" y="1142" class="t s muted">Design stance: build a governed relationship-operations system, not an autonomous outreach agent.</text>

</svg>