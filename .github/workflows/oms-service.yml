name: OMS service checks

on:
  pull_request:
    paths:
      - 'case-studies/travel-logistics-transformation/service/**'
      - 'test/oms-service.test.mjs'
      - '.github/workflows/oms-service.yml'
  push:
    branches: [main]
    paths:
      - 'case-studies/travel-logistics-transformation/service/**'
      - 'test/oms-service.test.mjs'
      - '.github/workflows/oms-service.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: case-studies/travel-logistics-transformation/service
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/oms
      OMS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/oms
      PGSSL: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: case-studies/travel-logistics-transformation/service/package-lock.json
      - run: npm ci
      - run: npm run migrate
      - run: npm test
      - run: npm run test:db
